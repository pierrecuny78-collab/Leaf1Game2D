name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;23.2.8568313 cmake;3.10.2.4988404'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Create Android debug keystore
        run: |
          mkdir -p "$RUNNER_TEMP"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Godot and Android export templates
        run: |
          set -eux
          GODOT_VERSION=4.4.1
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          sudo install -m 0755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d templates
          cp -r templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Verify Android toolchain
        run: |
          sdkmanager --list_installed | grep -E "platforms;android-35|build-tools;35.0.0|ndk;23.2.8568313|cmake;3.10.2.4988404"
          java -version

      - name: Configure Godot Android SDK paths
        run: |
          export JAVA_HOME="${JAVA_HOME:-$JAVA_HOME_17_X64}"
          test -d "$ANDROID_HOME"
          test -d "$JAVA_HOME"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          EOF

      - name: Validate project
        run: godot --headless --editor --path . --quit

      - name: Configure Android signing in export preset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("export_presets.cfg")
          s = p.read_text()
          marker = '[preset.0.options]'
          options = '''[preset.0.options]
          keystore/debug="/home/runner/work/_temp/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          '''
          if marker not in s:
              raise SystemExit("Android export preset options section missing")
          s = s.replace(marker, options.rstrip(), 1)
          p.write_text(s)
          PY

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug Android build/Leaf1Game2D-debug.apk
          test -s build/Leaf1Game2D-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Leaf1Game2D-Android-APK
          path: build/Leaf1Game2D-debug.apk
          if-no-files-found: error
          retention-days: 30
