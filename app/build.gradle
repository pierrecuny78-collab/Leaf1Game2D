plugins { id 'com.android.application' }

android {
    namespace 'com.leafvibe.leaf1game2d'
    compileSdk 35
    defaultConfig {
        applicationId 'com.leafvibe.leaf1game2d'
        minSdk 23
        targetSdk 28
        versionCode 3
        versionName '0.3.0-alpha'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -Wall -Wextra' } }
    }
    externalNativeBuild { cmake { path file('../engine/CMakeLists.txt'); version '3.22.1' } }
}
