plugins { id 'com.android.application' }

android {
    namespace 'com.leafvibe.leafstudio2d'
    compileSdk 35
    defaultConfig {
        applicationId 'com.leafvibe.leafstudio2d'
        minSdk 23
        targetSdk 28
        versionCode 9
        versionName '0.6.1'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -Wall -Wextra' } }
    }
    externalNativeBuild { cmake { path file('../engine/CMakeLists.txt'); version '3.22.1' } }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
